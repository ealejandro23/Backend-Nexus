services:
  postgres:
    image: postgres:16
    container_name: nexus-postgres
    environment:
      POSTGRES_DB: nexus_retail
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5432:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: nexus-redis
    ports:
      - "6379:6379"

volumes:
  nexus_pgdata:
