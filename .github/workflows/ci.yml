name: CI/CD Pipeline - Nexo Recommender

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  create:
    tags:
      - 'ep2'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: nexo-recommender

jobs:
  # ===========================================================================
  # TESTS
  # ===========================================================================
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ia, dominio, datos]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ "${{ matrix.service }}" = "ia" ]; then
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r ia/requirements.txt
        elif [ "${{ matrix.service }}" = "dominio" ]; then
          pip install -r dominio/requirements.txt
        else
          pip install pandas numpy scikit-learn joblib
        fi
    
    - name: Run tests
      run: |
        if [ "${{ matrix.service }}" = "ia" ]; then
          pytest ia/tests/ -v --cov=ia
        elif [ "${{ matrix.service }}" = "dominio" ]; then
          pytest dominio/tests/ -v --cov=dominio
        else
          pytest datos/tests/ -v --cov=datos
        fi

  # ===========================================================================
  # BUILD AND PUSH IMAGES
  # ===========================================================================
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        service: [gateway, front, ia, dominio, carga]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
        tags: |
          type=sha,prefix=sha-
          type=raw,value=latest
    
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: ./${{ matrix.service }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ===========================================================================
  # TAG EP2
  # ===========================================================================
  tag-ep2:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/ep2')
    
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        service: [gateway, front, ia, dominio, carga]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Pull latest image
      run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
    
    - name: Tag as ep2
      run: |
        docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:ep2
    
    - name: Push ep2 tag
      run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:ep2
