name: CI/CD Pipeline - Backend Nexus

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  create:
    tags:
      - 'ep2'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ealejandro23/backend

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install pandas numpy scikit-learn joblib psycopg2-binary
    
    - name: Run tests
      run: |
        echo "Running tests..."
        if [ -f "datos/tests/test_preparar.py" ]; then
          pytest datos/tests/ -v --cov=datos 2>&1 || true
        else
          echo "No tests found, skipping..."
        fi
        echo "Tests step completed"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/ep2')
    
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,prefix=sha-
          type=raw,value=latest
    
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-and-push-dominio:
    needs: test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/ep2')
    
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta-dominio
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/ealejandro23/dominio
        tags: |
          type=sha,prefix=sha-
          type=raw,value=latest
    
    - name: Build and push dominio image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./dominio/Dockerfile
        push: true
        tags: ${{ steps.meta-dominio.outputs.tags }}
        labels: ${{ steps.meta-dominio.outputs.labels }}
        platforms: linux/amd64
        cache-from: type=gha
        cache-to: type=gha,mode=max

  tag-ep2-dominio:
    needs: build-and-push-dominio
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/ep2')
    
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Pull latest dominio image
      run: docker pull ${{ env.REGISTRY }}/ealejandro23/dominio:latest
    
    - name: Tag as ep2
      run: |
        docker tag ${{ env.REGISTRY }}/ealejandro23/dominio:latest ${{ env.REGISTRY }}/ealejandro23/dominio:ep2
    
    - name: Push ep2 tag
      run: docker push ${{ env.REGISTRY }}/ealejandro23/dominio:ep2

  tag-ep2:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/ep2')
    
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Pull latest image
      run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
    
    - name: Tag as ep2
      run: |
        docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ep2
    
    - name: Push ep2 tag
      run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ep2